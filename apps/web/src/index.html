<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="manifest" href="/manifest.webmanifest">
  <title>Cobrança IA · Premium Ops</title>
  <link rel="stylesheet" href="/src/base.css">
</head>
<body>
  <main class="container">
    <header class="topbar">
      <h1>Painel Operacional</h1>
      <nav class="tabs">
        <a href="/clientes" data-link>Clientes</a>
        <a href="/servidores" data-link>Servidores</a>
        <a href="/aplicativos" data-link>Aplicativos</a>
        <a href="/cobrancas" data-link>Cobranças</a>
        <a href="/pagamentos" data-link>Pagamentos</a>
        <a href="/vencimentos" data-link>Vencimentos</a>
        <a href="/resultados" data-link>Resultados</a>
        <a href="/whatsapp" data-link>WhatsApp</a>
        <a href="/assistente" data-link>Assistente IA</a>
      </nav>
    </header>
    <section id="feedback" class="feedback" hidden></section>
    <section id="app"></section>
  </main>
<script>
const API = 'http://localhost:3001';
const AUTH = {'x-company-id':'company-demo','x-user-id':'owner-demo','x-role':'owner','content-type':'application/json'};
const state = { customers: [], servers: [], apps: [], loading: false, selectedApp: null, whatsapp: {status:null,qr:null,panel:null,admin:null,history:null,queue:null,polling:false} };

function mask(v){ if(!v) return '••••'; return '••••'; }
function el(id){ return document.getElementById(id); }
function setFeedback(msg,type='ok'){ const box=el('feedback'); box.hidden=!msg; box.className=`feedback ${type}`; box.textContent=msg||''; }

async function api(path, opt={}){
  const res = await fetch(`${API}${path}`, { ...opt, headers: {...AUTH, ...(opt.headers||{})} });
  const data = await res.json().catch(()=>({}));
  if(!res.ok) throw new Error(data.erro || 'Não foi possível concluir a ação agora.');
  return data;
}

function statusClass(status=''){ return String(status).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,'-'); }

function money(cents){ return new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format((Number(cents)||0)/100); }
function financeCard(item, showFee=false){
  return `<article class="mini-card premium">
  <div class="row between"><strong>${item.external_reference||item.provider_payment_id||item.id}</strong><span class="badge ${statusClass(item.ui_status||item.status||'')}">${item.ui_status||item.status||'n/a'}</span></div>
  <div class="meta">Cliente: ${item.customer_id||'N/D'} · ${new Date(item.created_at||Date.now()).toLocaleString('pt-BR')}</div>
  <div class="chips"><span class="chip" style="--chip:#3b82f6">Valor: ${money(item.amount_cents||item.paid_amount_cents||item.charge_amount_cents||0)}</span>${showFee?`<span class="chip" style="--chip:#8b5cf6">Taxa plataforma: ${money(item.platform_fee_cents||0)}</span>`:''}</div>
  ${item.due_date?`<div class="meta">Vencimento: ${item.due_date}</div>`:''}
  </article>`;
}

async function renderFinanceList(kind){
  const app=el('app');
  app.innerHTML=`<section class="card"><h2>${kind}</h2><form id="fFinance" class="grid"><input name="q" placeholder="Buscar"/><select name="status"><option value="">Todos status</option><option>pago</option><option>pendente</option><option>vencido</option><option>cancelado</option><option>aguardando confirmação</option></select><button>Filtrar</button></form><div id="finList" class="list">${Array.from({length:3}).map(()=>'<div class="skeleton"></div>').join('')}</div></section>`;
  async function load(){
    const fd=new FormData(el('fFinance')); const q=fd.get('q')||''; const status=fd.get('status')||'';
    try{
      let endpoint='/financeiro/cobrancas';
      if(kind==='Pagamentos') endpoint='/financeiro/pagamentos';
      const data=await api(`${endpoint}?q=${encodeURIComponent(q)}&status=${encodeURIComponent(status)}`);
      const items=data.items||[];
      el('finList').innerHTML=items.length?items.map(i=>financeCard(i, kind==='Cobranças')).join(''):'<p>Sem registros por aqui ainda. Ajuste os filtros para continuar.</p>';
    }catch(err){ el('finList').innerHTML='<p>Não conseguimos carregar agora. Tente novamente em instantes.</p>'; }
  }
  el('fFinance').onsubmit=(e)=>{e.preventDefault(); load();};
  load();
}

async function renderVencimentos(){
  const app=el('app');
  app.innerHTML='<section class="card"><h2>Vencimentos próximos</h2><div id="venList" class="list"><div class="skeleton"></div><div class="skeleton"></div></div></section>';
  try{const data=await api('/financeiro/vencimentos'); const items=data.items||[]; el('venList').innerHTML=items.length?items.map(i=>financeCard(i,true)).join(''):'<p>Nenhum vencimento para os próximos dias.</p>';}
  catch(e){el('venList').innerHTML='<p>Falha ao carregar vencimentos.</p>';}
}

async function renderResultados(){
  const app=el('app');
  app.innerHTML='<section class="card"><h2>Resultados</h2><div id="resumo"></div><h3>Histórico financeiro</h3><div id="hist" class="list"><div class="skeleton"></div></div></section>';
  try{const [resumo,hist]=await Promise.all([api('/financeiro/resumo-dono'),api('/financeiro/historico')]);
    el('resumo').innerHTML=`<div class="chips"><span class="chip" style="--chip:#22c55e">Recebidos: ${resumo.recebidos||0}</span><span class="chip" style="--chip:#f59e0b">Pendentes: ${resumo.pendentes||0}</span><span class="chip" style="--chip:#3b82f6">Volume: ${money(resumo.volume_cents||0)}</span><span class="chip" style="--chip:#8b5cf6">Taxas: ${money(resumo.taxas_plataforma_cents||0)}</span></div>`;
    const items=hist.items||[]; el('hist').innerHTML=items.length?items.map(i=>financeCard(i,false)).join(''):'<p>Histórico ainda vazio.</p>'; }
  catch(e){el('hist').innerHTML='<p>Não foi possível carregar os resultados.</p>';}
}



function statusLabel(s='desconectado'){ const map={conectado:'Conectado',desconectado:'Desconectado',conectando:'Conectando',pausado:'Pausado',falha:'Falha'}; return map[s]||'Desconectado'; }
function safeDate(v){ if(!v) return 'Sem registro'; const d=new Date(v); return Number.isNaN(d.getTime())?'Sem registro':d.toLocaleString('pt-BR'); }

const waPoll = { timer:null, inFlight:false, errorCount:0, stopUntil:0, active:false };
function stopWaPolling(){ waPoll.active=false; if(waPoll.timer){ clearTimeout(waPoll.timer); waPoll.timer=null; } waPoll.inFlight=false; }
function scheduleWaPoll(fn,delay=8000){ if(!waPoll.active) return; if(document.hidden) return; if(waPoll.timer) clearTimeout(waPoll.timer); waPoll.timer=setTimeout(fn,delay); }



const iaPoll={timer:null,inFlight:false,active:false,errorCount:0,stopUntil:0};
function stopIaPolling(){iaPoll.active=false;if(iaPoll.timer) clearTimeout(iaPoll.timer);iaPoll.timer=null;iaPoll.inFlight=false;}
function scheduleIaPoll(fn,delay=10000){ if(!iaPoll.active||document.hidden) return; if(iaPoll.timer) clearTimeout(iaPoll.timer); iaPoll.timer=setTimeout(fn,delay);}
function iaStatusLabel(v=''){const map={ativa:'Ativa',pausada:'Pausada',limitada:'Limitada',bloqueada:'Bloqueada',aguardando_humano:'Aguardando humano',erro_operacional:'Erro operacional'};return map[v]||v||'Ativa';}
async function renderAssistente(){
 const app=el('app');
 app.innerHTML=`<section class="card"><h2>Assistente IA</h2><div id="iaResumo" class="list"><div class="skeleton"></div></div><h3>Configurações IA empresa</h3><form id="iaCfg" class="grid"><label><input type="checkbox" name="enabled"> IA ativa</label><input type="time" name="operating_start"><input type="time" name="operating_end"><input type="number" name="daily_token_limit" placeholder="Limite diário"><input type="number" name="monthly_token_limit" placeholder="Limite mensal"><label><input type="checkbox" name="economic_mode"> Modo econômico</label><label><input type="checkbox" name="fallback_auto"> Fallback automático</label><button>Salvar</button></form><h3>Handoff humano</h3><div id="iaHandoff" class="list"><div class="skeleton"></div></div><h3>Histórico IA</h3><div id="iaHist" class="list"><div class="skeleton"></div></div><div class="row between"><button id="iaPrev" class="ghost">Anterior</button><button id="iaNext" class="ghost">Próxima</button></div><h3>Guardrails</h3><div id="iaGuards" class="list"><div class="skeleton"></div></div><h3>Painel IA Admin</h3><div id="iaAdmin" class="list"><p class="meta">Disponível para administradores.</p></div></section>`;
 let page=1;
 async function load(){
  if(iaPoll.inFlight) return;
  if(document.hidden) return scheduleIaPoll(load,10000);
  if(Date.now()<iaPoll.stopUntil) return scheduleIaPoll(load,10000);
  iaPoll.inFlight=true;
  try{
   const [dono,hist,handoff,guards,cfg]=await Promise.all([api('/ia/painel-dono'),api(`/ia/historico?page=${page}&limit=8`),api('/ia/handoff/fila'),api('/ia/guardrails/eventos'),api('/ia/configuracao')]);
   iaPoll.errorCount=0; iaPoll.stopUntil=0;
   el('iaResumo').innerHTML=`<article class="mini-card"><div class="row between"><strong>Status IA</strong><span class="badge ${statusClass(dono.status_ia||'ativa')}">${iaStatusLabel(dono.status_ia)}</span></div><div class="chips"><span class="chip" style="--chip:#3b82f6">Consumo diário: ${dono.consumo_diario||0}</span><span class="chip" style="--chip:#8b5cf6">Consumo mensal: ${dono.consumo_mensal||0}</span><span class="chip" style="--chip:#22c55e">Mensagens: ${dono.mensagens_respondidas||0}</span><span class="chip" style="--chip:#f59e0b">Custo estimado: ${money(dono.custo_estimado_cents||0)}</span><span class="chip" style="--chip:#64748b">Modelo: ${dono.modelo_usado||'n/d'}</span><span class="chip" style="--chip:#ef4444">Fallback: ${dono.fallback_ativo?'Ativo':'Inativo'}</span><span class="chip" style="--chip:#0ea5e9">Limite restante: ${dono.limite_restante_tokens||0}</span></div></article>`;
   el('iaCfg').enabled.checked=!!cfg.enabled; el('iaCfg').daily_token_limit.value=cfg.daily_token_limit||''; el('iaCfg').monthly_token_limit.value=cfg.monthly_token_limit||'';
   el('iaHandoff').innerHTML=`<article class="mini-card"><div class="chips"><span class="chip" style="--chip:#ef4444">Aguardando humano: ${handoff.aguardando_humano||0}</span><span class="chip" style="--chip:#f59e0b">Fila humana: ${(handoff.fila_humana||[]).length}</span><span class="chip" style="--chip:#22c55e">Status: ${handoff.status_operacional||'estavel'}</span></div>${(handoff.fila_humana||[]).map(i=>`<div class='row between'><span>${i.conversation_id.slice(0,8)} · ${i.status}</span><span><button data-assumir='${i.conversation_id}' class='ghost'>Assumir conversa</button> <button data-retomar='${i.conversation_id}' class='ghost'>Devolver para IA</button></span></div>`).join('')}</article>`;
   const items=hist.items||[]; el('iaHist').innerHTML=items.length?items.map(i=>`<article class='mini-card'><div class='row between'><strong>${i.intencao||'n/d'}</strong><span class='badge ${statusClass(i.status||'ativa')}'>${i.status||'ativa'}</span></div><div class='meta'>Cliente: ${i.pergunta_cliente||'-'}</div><div class='meta'>IA: ${i.resposta_ia||'-'}</div><div class='meta'>${safeDate(i.horario)} · ${i.tempo_resposta_ms||0}ms · handoff: ${i.handoff_humano?'Sim':'Não'}</div><div class='meta'>Guardrail: ${i.bloqueio_guardrail||'Sem bloqueio'}</div></article>`).join(''):'<p class="meta">Histórico ainda vazio.</p>';
   const gs=guards.items||[]; el('iaGuards').innerHTML=gs.length?gs.map(g=>`<article class='mini-card'><strong>${g.evento}</strong><div class='meta'>Ação proibida: ${g.acao_proibida||'n/d'} · confirmação financeira bloqueada: ${g.confirmacao_financeira_bloqueada?'Sim':'Não'} · limite excedido: ${g.limite_excedido?'Sim':'Não'}</div></article>`).join(''):'<p class="meta">Nenhum evento de guardrail.</p>';
   try{const admin=await api('/admin/ia/painel');el('iaAdmin').innerHTML=`<article class='mini-card'><div class='chips'><span class='chip' style='--chip:#3b82f6'>Maior consumo: ${(admin.empresas_maior_consumo||[]).length}</span><span class='chip' style='--chip:#f59e0b'>Limitadas: ${admin.empresas_limitadas||0}</span><span class='chip' style='--chip:#ef4444'>Erros IA: ${admin.erros_ia||0}</span><span class='chip' style='--chip:#8b5cf6'>Fallback ativo: ${admin.fallback_ativo||0}</span><span class='chip' style='--chip:#dc2626'>Risco custo: ${admin.risco_custo||0}</span><span class='chip' style='--chip:#22c55e'>Uso OpenAI: ${admin.uso_openai_tokens||0}</span><span class='chip' style='--chip:#64748b'>Pausadas: ${admin.empresas_pausadas||0}</span></div></article>`;}catch{}
   document.querySelectorAll('[data-assumir]').forEach(b=>b.onclick=async()=>{await api(`/ia/handoff/${b.dataset.assumir}/assumir`,{method:'POST'});load();});
   document.querySelectorAll('[data-retomar]').forEach(b=>b.onclick=async()=>{await api(`/ia/handoff/${b.dataset.retomar}/retomar-ia`,{method:'POST'});load();});
  }catch(e){
   iaPoll.errorCount=(iaPoll.errorCount||0)+1;
   if(iaPoll.errorCount>=3){
     iaPoll.stopUntil=Date.now()+30000;
     setFeedback('Detectamos falhas seguidas no Assistente IA. Vamos tentar novamente em instantes.','err');
   }
   el('iaResumo').innerHTML='<p class="meta">Erro operacional ao carregar IA.</p>';
  }
  finally{iaPoll.inFlight=false;}
  if(location.pathname==='/assistente'&&iaPoll.active) scheduleIaPoll(load,10000);
 }
 el('iaPrev').onclick=()=>{page=Math.max(1,page-1);load();}; el('iaNext').onclick=()=>{page+=1;load();};
 el('iaCfg').onsubmit=async(e)=>{e.preventDefault(); const fd=new FormData(e.target); const body={enabled:fd.get('enabled')==='on',daily_token_limit:Number(fd.get('daily_token_limit')||0),monthly_token_limit:Number(fd.get('monthly_token_limit')||0),operating_start:fd.get('operating_start')||null,operating_end:fd.get('operating_end')||null,economic_mode:fd.get('economic_mode')==='on',fallback_auto:fd.get('fallback_auto')==='on'}; await api('/ia/configuracao',{method:'PATCH',body:JSON.stringify(body)}); setFeedback('Configuração da IA atualizada.'); load();};
 stopIaPolling(); iaPoll.active=true; await load();
}
async function renderWhatsapp(){
  const app=el('app');
  app.innerHTML=`<section class="card"><h2>WhatsApp operacional</h2>
  <div id="waStatus" class="list"><div class="skeleton"></div></div>
  <div class="wa-actions">
    <button data-wa-action="conectar">Conectar</button><button data-wa-action="reconectar" class="ghost">Reconectar</button><button data-wa-action="desconectar" class="ghost">Desconectar</button>
    <button data-wa-action="qr" class="ghost">Atualizar QR</button><button data-wa-action="pausar" class="ghost">Pausar fila</button><button data-wa-action="retomar" class="ghost">Retomar fila</button>
  </div>
  <div id="waQr" class="mini-card"><div class="skeleton"></div></div>
  <h3>Fila operacional</h3><div id="waQueue" class="list"><div class="skeleton"></div></div>
  <h3>Histórico operacional</h3><div id="waHistory" class="list"><div class="skeleton"></div></div>
  <h3>Painel Admin</h3><div id="waAdmin" class="list"><p class="meta">Disponível para administradores.</p></div>
  </section>`;

  async function act(kind){
    try{
      if(kind==='conectar') await api('/whatsapp/instancia/criar',{method:'POST',body:JSON.stringify({instance_name:'empresa_company-demo'})});
      if(kind==='reconectar') await api('/whatsapp/instancia/reconectar',{method:'POST'});
      if(kind==='desconectar') await api('/whatsapp/instancia/desconectar',{method:'POST'});
      if(kind==='qr') await api('/whatsapp/instancia/reconectar',{method:'POST'});
      if(kind==='pausar') await api('/whatsapp/fila/pausar',{method:'POST'});
      if(kind==='retomar') await api('/whatsapp/fila/retomar',{method:'POST'});
      setFeedback('Ação concluída com sucesso.');
      await loadWa(true);
    }catch(e){ setFeedback(e.message,'err'); }
  }
  document.querySelectorAll('[data-wa-action]').forEach(b=>b.onclick=()=>act(b.dataset.waAction));

  stopWaPolling();
  waPoll.active=true;
  async function loadWa(force=false){
    if(waPoll.inFlight) return;
    if(document.hidden) return scheduleWaPoll(loadWa,8000);
    if(Date.now()<waPoll.stopUntil) return scheduleWaPoll(loadWa,8000);
    waPoll.inFlight=true;
    try{
      const [status,qr,panel,history,queue]=await Promise.all([
        api('/whatsapp/instancia/status'),
        api('/whatsapp/instancia/qr'),
        api('/whatsapp/painel-dono'),
        api('/whatsapp/operacional/historico').catch(()=>({items:[]})),
        api('/whatsapp/operacional/fila').catch(()=>({}))
      ]);
      waPoll.errorCount=0; waPoll.stopUntil=0;
      state.whatsapp={...state.whatsapp,status,qr,panel,history,queue};
      const st=status?.status||'desconectado';
      el('waStatus').innerHTML=`<article class="mini-card"><div class="row between"><strong>Status da conexão</strong><span class="badge ${statusClass(st)}">${statusLabel(st)}</span></div><div class="meta">Última conexão: ${safeDate(status?.last_connected_at)}</div><div class="chips"><span class="chip" style="--chip:#3b82f6">Mensagens hoje: ${status?.sent_today||0}</span><span class="chip" style="--chip:#f59e0b">Limite diário: ${status?.daily_limit||0}</span></div></article>`;
      const qrv=qr?.qr_code;
      el('waQr').innerHTML=`<div class="row between"><strong>QR Code</strong><span class="meta">Atualização automática leve</span></div>${qrv?`<img class="wa-qr" src="https://api.qrserver.com/v1/create-qr-code/?size=280x280&data=${encodeURIComponent(qrv)}" alt="QR para conectar WhatsApp">`:'<p class="meta">QR ainda não disponível. Toque em “Atualizar QR”.</p>'}`;
      const queueData=queue||{};
      el('waQueue').innerHTML=`<article class="mini-card"><div class="chips"><span class="chip" style="--chip:#64748b">Pendente: ${queueData.pendente||0}</span><span class="chip" style="--chip:#0ea5e9">Enviando: ${queueData.enviando||0}</span><span class="chip" style="--chip:#ef4444">Falhou: ${queueData.falhou||0}</span><span class="chip" style="--chip:#f59e0b">Retries: ${queueData.retries||0}</span><span class="chip" style="--chip:#8b5cf6">Pausada: ${queueData.pausada?'Sim':'Não'}</span></div></article>`;
      const items=history?.items||[];
      el('waHistory').innerHTML=items.length?items.map(i=>`<article class="mini-card"><div class="row between"><strong>${i.tipo||'Mensagem'}</strong><span class="badge ${statusClass(i.status||'pendente')}">${i.status||'pendente'}</span></div><div class="meta">${safeDate(i.data)} · retries: ${i.retries||0}</div><div class="meta">${i.descricao||'Sem detalhes'}</div></article>`).join(''):'<p class="meta">Sem histórico operacional recente.</p>';
      try { const admin=await api('/admin/whatsapp/painel'); el('waAdmin').innerHTML=`<article class="mini-card"><div class="chips"><span class="chip" style="--chip:#ef4444">Desconectadas: ${admin.disconnected||0}</span><span class="chip" style="--chip:#f59e0b">Pausadas: ${admin.paused||0}</span><span class="chip" style="--chip:#eab308">Risco spam: ${admin.spam_risk_companies||0}</span><span class="chip" style="--chip:#dc2626">Falhas excessivas: ${admin.excessive_failures||0}</span><span class="chip" style="--chip:#7c3aed">Filas travadas: ${admin.stuck_queues||0}</span><span class="chip" style="--chip:#22c55e">Volume: ${admin.total_msgs||0}</span></div></article>`; } catch {}
    }catch(err){
      waPoll.errorCount +=1;
      if(force) setFeedback('Não foi possível atualizar o WhatsApp agora.','err');
      if(waPoll.errorCount>=3){
        waPoll.stopUntil=Date.now()+30000;
        setFeedback('Detectamos falhas seguidas. Vamos tentar novamente em instantes.','err');
      }
      el('waStatus').innerHTML='<p class="meta">Não conseguimos carregar o status agora.</p>';
    } finally { waPoll.inFlight=false; }
    if(location.pathname==='/whatsapp' && waPoll.active) scheduleWaPoll(loadWa,8000);
  }
  await loadWa(true);
}


function customerCard(c){
  const app = state.apps.find(a=>a.id===c.app_id);
  const server = state.servers.find(s=>s.id===c.primary_server_id);
  return `<article class="mini-card">
    <div class="row between"><strong>${c.name||'Sem nome'}</strong><span class="badge ${statusClass(c.status)}">${c.status||'n/a'}</span></div>
    <div class="meta">${c.whatsapp_e164||'Sem telefone'}</div>
    <div class="chips">
      <span class="chip" style="--chip:${server?.color||'#777'}">Servidor: ${server?.name||'N/D'}</span>
      <span class="chip" style="--chip:${app?.color||'#888'}">App: ${app?.name||'N/D'}</span>
    </div>
    <div class="secret-row">Senha: ${mask()} · MAC: ${mask()} · Key: ${mask()}</div>
    <button data-edit="${c.id}" class="ghost">Editar</button>
  </article>`;
}

async function loadBase(){
  const [servers, apps] = await Promise.all([api('/servidores'), api('/aplicativos')]);
  state.servers = servers; state.apps = apps;
}

async function renderClientes(){
  const app = el('app');
  app.innerHTML = `<section class="card"><h2>Clientes</h2>
    <form id="filtros" class="grid">
      <input name="q" placeholder="Buscar por nome ou telefone" />
      <select name="status"><option value="">Todos status</option><option>em_dia</option><option>atrasado</option><option>suspenso</option></select>
      <select name="servidor"><option value="">Todos servidores</option>${state.servers.map(s=>`<option value="${s.id}">${s.name}</option>`).join('')}</select>
      <select name="app"><option value="">Todos apps</option>${state.apps.map(a=>`<option value="${a.id}">${a.name}</option>`).join('')}</select>
      <button>Buscar</button>
    </form>
    <form id="novoCliente" class="grid compact"></form>
    <div id="listaClientes" class="list"></div>
  </section>`;
  renderClienteForm();
  async function buscar(q=''){
    let data = await api(`/clientes?page=1&limit=50&q=${encodeURIComponent(q.toLowerCase())}`);
    const f = new FormData(el('filtros'));
    const status=f.get('status'), server=f.get('servidor'), appId=f.get('app');
    let items = data.items || [];
    if(status) items = items.filter(i=>i.status===status);
    if(server) items = items.filter(i=>i.primary_server_id===server);
    if(appId) items = items.filter(i=>i.app_id===appId);
    state.customers = items;
    el('listaClientes').innerHTML = items.length ? items.map(customerCard).join('') : '<p>Nenhum cliente encontrado.</p>';
    document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>renderClienteForm(items.find(i=>i.id===b.dataset.edit)));
  }
  el('filtros').onsubmit = (e)=>{e.preventDefault(); buscar(new FormData(e.target).get('q')||'');};
  await buscar('');
}

function renderClienteForm(edit){
  const f = el('novoCliente');
  f.innerHTML = `<input name="name" placeholder="Nome" value="${edit?.name||''}" required>
  <input name="whatsapp_e164" placeholder="Telefone" value="${edit?.whatsapp_e164||''}" required>
  <input name="amount_cents" type="number" placeholder="Valor (centavos)" value="${edit?.amount_cents||''}">
  <input name="due_date" type="date" value="${edit?.due_date||''}">
  <select name="status"><option ${!edit||edit.status==='em_dia'?'selected':''}>em_dia</option><option ${edit?.status==='atrasado'?'selected':''}>atrasado</option><option ${edit?.status==='suspenso'?'selected':''}>suspenso</option></select>
  <select name="primary_server_id"><option value="">Servidor principal</option>${state.servers.map(s=>`<option value="${s.id}" ${edit?.primary_server_id===s.id?'selected':''}>${s.name}</option>`).join('')}</select>
  <select name="app_id" id="appSelect"><option value="">Aplicativo</option>${state.apps.map(a=>`<option value="${a.id}" ${edit?.app_id===a.id?'selected':''}>${a.name}</option>`).join('')}</select>
  <input name="alternative_server_ids" placeholder="Servidores alternativos (ids separados por vírgula)" value="${(edit?.alternative_server_ids||[]).join(',')}">
  <div id="dynamicFields"></div>
  <textarea name="notes" placeholder="Observações">${edit?.notes||''}</textarea>
  <button>${edit?'Salvar edição':'Criar cliente'}</button>`;
  const appSelect = el('appSelect');
  const dyn = el('dynamicFields');
  function redrawDynamic(){
    const picked = state.apps.find(a=>a.id===appSelect.value);
    if(!picked){ dyn.innerHTML=''; return; }
    dyn.innerHTML = `${picked.requires_username?'<input name="username" placeholder="Usuário">':''}
    ${picked.requires_password?'<input name="password" placeholder="Senha">':''}
    ${picked.requires_mac?'<input name="mac" placeholder="MAC">':''}
    ${picked.requires_key?'<input name="key" placeholder="Key">':''}
    ${picked.requires_link?'<input name="link_dns" placeholder="Link/DNS">':''}`;
  }
  appSelect.onchange = redrawDynamic; redrawDynamic();
  f.onsubmit = async (e)=>{e.preventDefault();
    try{
      const body = Object.fromEntries(new FormData(f).entries());
      body.amount_cents = Number(body.amount_cents||0);
      body.alternative_server_ids = String(body.alternative_server_ids||'').split(',').map(x=>x.trim()).filter(Boolean);
      const path = edit ? `/clientes/${edit.id}` : '/clientes';
      const method = edit ? 'PATCH' : 'POST';
      await api(path, {method, body: JSON.stringify(body)});
      setFeedback(edit?'Cliente atualizado com sucesso.':'Cliente criado com sucesso.');
      renderClientes();
    }catch(err){ setFeedback(err.message,'err'); }
  };
}

async function renderServidores(){
  const app=el('app');
  const servers = await api('/servidores'); state.servers=servers;
  app.innerHTML = `<section class="card"><h2>Servidores</h2><form id="novoServidor" class="grid compact">
    <input name="name" placeholder="Nome" required><input name="color" type="color" value="#777777"><select name="status"><option>ativo</option><option>manutencao</option></select><input name="fixed_link" placeholder="Link fixo"><textarea name="notes" placeholder="Observações"></textarea><button>Cadastrar servidor</button>
  </form><div class="list">${servers.map(s=>`<article class="mini-card"><strong>${s.name}</strong><span class="chip" style="--chip:${s.color}">${s.status}</span><small>${s.clientes_count||0} clientes</small></article>`).join('')}</div></section>`;
  el('novoServidor').onsubmit=async(e)=>{e.preventDefault();try{await api('/servidores',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(e.target).entries()))});setFeedback('Servidor cadastrado.');renderServidores();}catch(err){setFeedback(err.message,'err');}};
}

async function renderAplicativos(){
  const app=el('app');
  const apps = await api('/aplicativos'); state.apps=apps;
  app.innerHTML = `<section class="card"><h2>Aplicativos</h2><form id="novoApp" class="grid compact">
  <input name="name" placeholder="Nome" required><input name="color" type="color" value="#999999">
  <label><input type="checkbox" name="requires_username"> Usuário</label><label><input type="checkbox" name="requires_password"> Senha</label><label><input type="checkbox" name="requires_mac"> MAC</label><label><input type="checkbox" name="requires_key"> Key</label><label><input type="checkbox" name="requires_link"> Link</label>
  <textarea name="support_message" placeholder="Mensagem de suporte"></textarea><button>Cadastrar aplicativo</button></form>
  <div class="list">${apps.map(a=>`<article class="mini-card"><strong>${a.name}</strong><span class="chip" style="--chip:${a.color}">${a.color}</span></article>`).join('')}</div></section>`;
  el('novoApp').onsubmit=async(e)=>{e.preventDefault();try{const fd=new FormData(e.target);const body=Object.fromEntries(fd.entries());['requires_username','requires_password','requires_mac','requires_key','requires_link'].forEach(k=>body[k]=fd.get(k)==='on');await api('/aplicativos',{method:'POST',body:JSON.stringify(body)});setFeedback('Aplicativo cadastrado.');renderAplicativos();}catch(err){setFeedback(err.message,'err');}};
}

async function router(){
  setFeedback('');
  if(location.pathname!=='/whatsapp') stopWaPolling();
  if(location.pathname!=='/assistente') stopIaPolling();
  try {
    await loadBase();
    const p = location.pathname;
    if(p==='/servidores') return renderServidores();
    if(p==='/aplicativos') return renderAplicativos();
    if(p==='/cobrancas') return renderFinanceList('Cobranças');
    if(p==='/pagamentos') return renderFinanceList('Pagamentos');
    if(p==='/vencimentos') return renderVencimentos();
    if(p==='/resultados') return renderResultados();
    if(p==='/whatsapp') return renderWhatsapp();
    if(p==='/assistente') return renderAssistente();
    return renderClientes();
  } catch (err){ setFeedback(err.message,'err'); el('app').innerHTML='<section class="card"><p>Erro ao carregar dados. Tente novamente.</p></section>'; }
}

document.addEventListener('click', e=>{ const a=e.target.closest('[data-link]'); if(!a) return; e.preventDefault(); history.pushState({},'',a.getAttribute('href')); router();});
document.addEventListener('visibilitychange',()=>{
  if(location.pathname==='/whatsapp'){ if(document.hidden){ stopWaPolling(); } else { renderWhatsapp(); } return; }
  if(location.pathname==='/assistente'){ if(document.hidden){ stopIaPolling(); } else { renderAssistente(); } }
});
window.addEventListener('popstate', router);
router();
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}));}
</script>
</body>
